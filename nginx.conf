events {
    worker_connections 1024;
}

http {
    # Usamos la ruta relativa nativa del Nginx de Nixpacks
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /app;

        # 1. Servir la PWA en la raíz (http://tu-dominio.com/)
        location / {
            root /app/pwa;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Servir la API en la ruta /api (http://tu-dominio.com/api)
        location /api {
            alias /app/public;
            index index.php;
            try_files $uri $uri/ /api/index.php?$query_string;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                
                # Forzamos a Nginx a leer el index de tu API
                fastcgi_param SCRIPT_FILENAME /app/public/index.php;
                
                # Variables estándar requeridas por la mayoría de frameworks PHP
                fastcgi_param SERVER_NAME $host;
                fastcgi_param REDIRECT_STATUS 200;
            }
        }
    }
}