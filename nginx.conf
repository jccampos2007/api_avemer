events {
    worker_connections 1024;
}

http {
    # Usar el archivo mime.types que creamos en la raíz
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Servir la PWA de forma directa en la raíz base (/)
        location / {
            root /app/pwa;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Capturar y procesar todas las peticiones a la API (/api)
        location /api {
            # Definimos la raíz específica para la API
            root /app/public;
            
            # Reescribimos internamente la ruta para que apunte al index.php de Laravel/PHP
            # Esto evita el 404 y pasa los parámetros correctos ($query_string)
            rewrite ^/api/(.*)$ /index.php?/$1 last;
        }

        # 3. Procesar las peticiones PHP enviándolas a PHP-FPM
        location ~ \.php$ {
            # Volvemos a setear la raíz de ejecución real de la API
            root /app/public;
            
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            
            # Usar el archivo fastcgi_params que creamos en la raíz
            include fastcgi_params;
            
            # Ruta exacta absoluta al script index.php dentro del contenedor
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            
            # Variables de entorno HTTP requeridas para procesar las cabeceras correctamente
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param REDIRECT_STATUS 200;
        }
    }
}